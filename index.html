<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D-Attraktoren</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <!-- werkbank: hochkant untereinander, quer Canvas links und Bedienung rechts (style.css) -->
    <main class="seite werkbank">
      <header class="projekt-kopf">
        <h1>3D-Attraktoren</h1>
        <ul class="tags">
          <li>attraktor</li>
          <li>projekt</li>
        </ul>
      </header>

      <div class="canvas-wrapper">
        <canvas id="zeichenBild"></canvas>
      </div>

      <div class="bedienung">
        <div class="steuerung">
          <button type="button" id="sofortBtn">Animieren</button>

          <label>Punkte <input type="number" id="punkte" min="1000" max="10000000" step="1000"></label>
          <label>Stärke <input type="number" id="staerke" min="1" max="255" step="1"></label>
          <label>Abstand <input type="number" id="abstand" min="0.2" max="20" step="0.1"></label>

          <button type="button" id="ansichtBtn">Ansicht Zurücksetzen</button>
        </div>
        <div class="steuerung">
          <label><input type="checkbox" id="farbigCheck"> Farbe</label>
          <label>Rot <input type="range" min="0" max="1" step="0.01" value="1" id="red"></label>
          <label>Blau <input type="range" min="0" max="1" step="0.01" value="1" id="blue"></label>
        </div>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
