<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D-Attraktoren</title>
    <link rel="icon" href="data:,">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <!-- werkbank: hochkant untereinander, quer Canvas links und Bedienung rechts (style.css) -->
    <main class="seite werkbank">
      <header class="projekt-kopf">
        <h1>3D-Attraktoren</h1>
        <ul class="tags">
          <li>attraktor</li>
          <li>projekt</li>
        </ul>
      </header>
      <div class="canvas-wrapper">
        <canvas id="zeichenBild"></canvas>
      </div>
      <div class="bedienung">
        <div class="steuerung">
          <button type="button" id="sofortBtn">Animieren</button>

          <label>Punkte <input type="number" id="punkte" min="1000" max="10000000" step="1000"></label>
          <label>Abstand <input type="number" id="abstand" min="0.2" max="20" step="0.1"></label>

          <button type="button" id="ansichtBtn">Ansicht Zurücksetzen</button>
        </div>
        <!-- data-wert="name": main.js liest den Wert als einstellung.name, ein <output> dahinter zeigt ihn an -->
        <div class="steuerung">
          <label><input type="checkbox" data-wert="travel"> Travel</label>
          <label><input type="checkbox" data-wert="endlos" checked> Endlos</label>
          <label>Länge <input type="range" data-wert="laenge" min="100" max="10000" step="100" value="1000"><output></output></label>
          <label>Kopf <input type="range" data-wert="kopf" min="0" max="1000000" step="1" value="0"><output></output></label>
          <label>Tempo <input type="range" data-wert="tempo" min="1" max="2000" step="1" value="30"><output></output></label>
          <label>Rest <input type="range" data-wert="rest" min="0" max="1" step="0.1" value="0.5"><output></output></label>
          <label>Glanz <input type="range" data-wert="glanz" min="1" max="50" step="1" value="20"><output></output></label>
        </div>
        <div class="steuerung">
          <label>Helligkeit <input type="range" data-wert="staerke" min="1" max="255" step="1" value="10"><output></output></label>
          <label><input type="checkbox" data-wert="invertiert"> Invertieren</label>
          <label><input type="checkbox" data-wert="farbig"> Farbe</label>
          <label>Rot <input type="range" data-wert="red" min="0" max="1" step="0.01" value="1"><output></output></label>
          <label>Blau <input type="range" data-wert="blue" min="0" max="1" step="0.01" value="1"><output></output></label>
        </div>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
